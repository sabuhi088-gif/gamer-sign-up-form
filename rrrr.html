
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEONCORE - Sign Up</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #080c10;
            color: #e8f0f5;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            min-height: 580px;
            background: #05090d;
            display: flex;
            padding: 60px;
            gap: 70px;
            border: 1px solid #1d2930;
        }

        .left {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .logo {
            color: #c6ff38;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 65px;
        }

        h1 {
            font-size: 48px;
            line-height: 1.1;
            letter-spacing: 2px;
        }

        h1 span {
            color: #c6ff38;
        }

        .subtitle {
            font-size: 9px;
            letter-spacing: 2px;
            color: #77838b;
            margin-top: 18px;
        }

        .operator {
            margin-top: 75px;
            border-top: 1px solid #253039;
            padding-top: 20px;
        }

        .operator p {
            font-size: 10px;
            color: #89959d;
            letter-spacing: 2px;
        }

        .operator h2 {
            font-size: 19px;
            margin: 10px 0 20px;
        }

        .status p {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #1d2930;
            padding: 9px 0;
        }

        .status span {
            color: #89959d;
            font-size: 9px;
        }

        .right {
            width: 390px;
            border: 1px solid #27343c;
            padding: 25px;
        }

        .form-header {
            display: flex;
            justify-content: space-between;
            font-size: 9px;
            letter-spacing: 1px;
            color: #89959d;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 22px;
        }

        .input-group label {
            display: block;
            font-size: 10px;
            color: #c6ff38;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            height: 42px;
            background: #080e13;
            border: 1px solid #35434c;
            color: white;
            padding: 10px;
            outline: none;
            font-size: 13px;
        }

        input:focus {
            border-color: #c6ff38;
        }

        input::placeholder {
            color: #66727a;
        }

        .input-group small {
            display: block;
            color: #78848b;
            font-size: 9px;
            margin-top: 7px;
        }

        .error {
            color: #ff6262 !important;
            font-size: 10px !important;
        }

        .password-box {
            display: flex;
            position: relative;
        }

        .password-box input {
            padding-right: 45px;
        }

        .toggle {
            position: absolute;
            right: 10px;
            top: 10px;
            background: none;
            color: #aab4bb;
            border: none;
            cursor: pointer;
        }

        .strength {
            display: flex;
            gap: 5px;
            margin-top: 10px;
        }

        .strength div {
            height: 4px;
            flex: 1;
            background: #26323a;
        }

        .strength .active {
            background: #c6ff38;
        }

        .terms {
            display: flex;
            align-items: center;
            gap: 9px;
            font-size: 11px;
            margin: 20px 0;
        }

        .terms input {
            accent-color: #c6ff38;
        }

        a {
            color: #c6ff38;
            text-decoration: none;
        }

        #submitBtn {
            width: 100%;
            height: 45px;
            background: #c6ff38;
            color: #080c10;
            border: none;
            font-weight: bold;
            letter-spacing: 1px;
            cursor: pointer;
            transition: 0.3s;
        }

        #submitBtn:hover {
            background: #e0ff80;
            box-shadow: 0 0 20px #c6ff3866;
        }

        #submitBtn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .login {
            text-align: center;
            font-size: 10px;
            color: #89959d;
            margin-top: 20px;
        }

        #success {
            color: #c6ff38;
            text-align: center;
            margin-top: 15px;
            font-size: 12px;
        }

        @media (max-width: 750px) {
            body {
                padding: 15px;
            }

            .container {
                flex-direction: column;
                padding: 25px;
                gap: 35px;
            }

            .logo {
                margin-bottom: 35px;
            }

            h1 {
                font-size: 38px;
            }

            .operator {
                margin-top: 35px;
            }

            .right {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="left">
        <div class="logo">⬡ NEONCORE</div>

        <h1><span>//</span> JOIN THE<br> NEXUS</h1>

        <p class="subtitle">INITIALIZE YOUR NEONCORE IDENTITY</p>

        <div class="operator">
            <p>OPERATOR ID</p>
            <h2 id="operator">UNASSIGNED</h2>

            <div class="status">
                <p>CALLSIGN <span id="nameStatus">PENDING</span></p>
                <p>EMAIL <span id="emailStatus">PENDING</span></p>
                <p>PASSWORD <span id="passwordStatus">PENDING</span></p>
                <p>CONFIRM <span id="confirmStatus">PENDING</span></p>
                <p>TERMS <span id="termsStatus">REQUIRED</span></p>
            </div>
        </div>
    </div>

    <div class="right">

        <div class="form-header">
            <span>NEW OPERATOR</span>
            <span>ALL FIELDS REQUIRED</span>
        </div>

        <form id="signupForm">

            <div class="input-group">
                <label for="name">› CALLSIGN</label>
                <input type="text" id="name" placeholder="e.g. Vortex_07">
                <small>3-20 characters: letters, numbers, _</small>
                <small class="error" id="nameError"></small>
            </div>

            <div class="input-group">
                <label for="email">› EMAIL</label>
                <input type="email" id="email" placeholder="you@example.com">
                <small class="error" id="emailError"></small>
            </div>

            <div class="input-group">
                <label for="password">› PASSWORD</label>

                <div class="password-box">
                    <input type="password" id="password">
                    <button type="button" class="toggle" data-target="password">◉</button>
                </div>

                <div class="strength">
                    <div id="bar1"></div>
                    <div id="bar2"></div>
                    <div id="bar3"></div>
                    <div id="bar4"></div>
                </div>

                <small id="strengthText">At least 8 characters</small>
                <small class="error" id="passwordError"></small>
            </div>

            <div class="input-group">
                <label for="confirm">› CONFIRM PASSWORD</label>

                <div class="password-box">
                    <input type="password" id="confirm">
                    <button type="button" class="toggle" data-target="confirm">◉</button>
                </div>

                <small class="error" id="confirmError"></small>
            </div>

            <div class="terms">
                <input type="checkbox" id="terms">
                <label for="terms">
                    I accept the <a href="#">Terms</a> and
                    <a href="#">Privacy Policy</a>.
                </label>
            </div>

            <small class="error" id="termsError"></small>

            <button type="submit" id="submitBtn">
                INITIALIZE ACCOUNT
            </button>

            <p class="login">
                Already an operator? <a href="#">Log in</a>
            </p>

            <div id="success"></div>

        </form>
    </div>

</div>

<script src="index.js"></script>

</body>
</html>
